language: php

php:
    - 7.0

env:
  global:
    - secure: 
    - DB_HOST="127.0.0.1"
    - DB_DATABASE="kabooodle_unittesting"
    - DB_USERNAME="shippable"
    - DB_PASSWORD=""

services:
    - mysql

before_script:
   - mysql -e "GRANT ALL ON *.* TO shippable@localhost IDENTIFIED BY ''; FLUSH PRIVILEGES;"
   - mkdir -p shippable/testresults
   - mkdir -p shippable/codecoverage
   - composer install --no-interaction --no-scripts --prefer-source --no-suggest

notifications:
  email: false

script:
   - phpunit --log-junit shippable/testresults/junit.xml

